<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Battler</title>
    <!-- Trunk builds the crate in this directory to wasm and runs wasm-opt on release builds. -->
    <link data-trunk rel="rust" data-wasm-opt="z" />
    <style>
      html, body {
        margin: 0;
        height: 100%;

        overflow: hidden;
      }
      #battler-canvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
      }
    </style>
  </head>
  <body>
    <canvas id="battler-canvas"></canvas>
  </body>
</html>
