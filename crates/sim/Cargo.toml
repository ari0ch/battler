[package]
name = "battler-sim"
description = "Deterministic battle simulation and unit instruction interpreter. No engine dependencies."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The sim stays pure Rust so it is fast to test, deterministic and reusable.
# The one exception is optional: with the `serde` feature, commands and the
# step log can be (de)serialized for multiplayer. Off by default, so the sim's
# own tests and the balance harness build with no dependencies at all.
serde = { version = "1", features = ["derive"], optional = true }

[features]
serde = ["dep:serde"]

[lints]
workspace = true
