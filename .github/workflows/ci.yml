name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  sim:
    name: Sim (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # The sim has no dependencies, so this job stays fast.
      - run: cargo clippy -p battler-sim --all-targets -- -D warnings
      - run: cargo test -p battler-sim

  game:
    name: Game (clippy, native build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Bevy's Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libudev-dev libwayland-dev libxkbcommon-dev
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      # On failure, compiler messages are also published as annotations, which are
      # readable through the GitHub API even where raw logs aren't.
      - name: Clippy
        run: |
          if ! cargo clippy -p battler --all-targets --message-format=short -- -D warnings 2> clippy.txt; then
            cat clippy.txt
            msgs=$(grep -E '^[^ ]+:[0-9]+:[0-9]+: ' clippy.txt | head -200 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=clippy::${msgs}"
            exit 1
          fi
