name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  sim:
    name: Sim (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Resolve dependencies
        run: |
          if ! cargo metadata --format-version 1 > /dev/null 2> resolve.txt; then
            cat resolve.txt
            echo "::error title=resolve::$(tail -c 3000 resolve.txt | tr '\n' ' ' | sed 's/%/%25/g')"
            exit 1
          fi
      - run: cargo fmt --all --check
      # The sim has no dependencies, so this job stays fast.
      - run: cargo clippy -p battler-sim --all-targets -- -D warnings
      - run: cargo test -p battler-sim

  game:
    name: Game (clippy, native build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Bevy's Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libudev-dev libwayland-dev libxkbcommon-dev
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Resolve dependencies
        run: |
          if ! cargo metadata --format-version 1 > /dev/null 2> resolve.txt; then
            cat resolve.txt
            echo "::error title=resolve::$(tail -c 3000 resolve.txt | tr '\n' ' ' | sed 's/%/%25/g')"
            exit 1
          fi
      # On failure, compiler messages are also published as annotations, which are
      # readable through the GitHub API even where raw logs aren't.
      - name: Clippy
        run: |
          if ! cargo clippy -p battler --all-targets --color never --message-format=short -- -D warnings 2> clippy.txt; then
            cat clippy.txt
            msgs=$(grep -E '^[^ ]+:[0-9]+:[0-9]+: ' clippy.txt | head -200 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=clippy::${msgs}"
            exit 1
          fi
      # Game-crate unit tests (pure logic such as battle motion). Failures are
      # published as an annotation too.
      - name: Tests
        run: |
          set -o pipefail
          if ! cargo test -p battler --bins --color never 2>&1 | tee test.txt; then
            msgs=$(grep -E "panicked|FAILED|assert|left:|right:" test.txt | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=tests::${msgs}"
            exit 1
          fi

  server:
    name: Server (clippy, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Resolve dependencies
        run: |
          if ! cargo metadata --format-version 1 > /dev/null 2> resolve.txt; then
            cat resolve.txt
            echo "::error title=resolve::$(tail -c 3000 resolve.txt | tr '\n' ' ' | sed 's/%/%25/g')"
            exit 1
          fi
      - name: Clippy
        run: |
          if ! cargo clippy -p battler-server -p battler-proto --all-targets --color never --message-format=short -- -D warnings 2> clippy.txt; then
            cat clippy.txt
            msgs=$(grep -E '^[^ ]+:[0-9]+:[0-9]+: ' clippy.txt | head -200 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=clippy::${msgs}"
            exit 1
          fi
      - run: cargo build -p battler-server
      - name: Tests (server and protocol)
        run: cargo test -p battler-server -p battler-proto
      # The workspace can't always resolve new dependencies where it's edited, so
      # CI publishes the lockfile it resolved; commit it when it changes.
      - uses: actions/upload-artifact@v4
        with:
          name: Cargo.lock
          path: Cargo.lock
