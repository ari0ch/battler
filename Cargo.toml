[workspace]
resolver = "3"
members = ["crates/sim", "crates/game"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ari0ch/battler"

[workspace.dependencies]
battler-sim = { path = "crates/sim" }
# Pinned on purpose: Bevy is pre-1.0 and breaks APIs every release.
# Upgrade deliberately, following the migration guide.
# `png` decodes the embedded character sprites.
bevy = { version = "0.20", default-features = false, features = ["2d", "ui", "png"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Dev builds: keep our code quick to compile, but optimise dependencies
# (Bevy is painfully slow at opt-level 0).
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Web release builds: small and fast to load.
[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "debuginfo"
